name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Restore locked dependencies
        run: dotnet restore ArtMarketplace.sln --locked-mode
      - name: Restore pinned local tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build ArtMarketplace.sln -c Release --no-restore
      - name: Verify EF model and migration snapshot agree
        run: dotnet ef migrations has-pending-model-changes --project src/Backend/ArtMarketplace.Infrastructure/ArtMarketplace.Infrastructure.csproj --startup-project src/Backend/ArtMarketplace.Api/ArtMarketplace.Api.csproj --configuration Release --no-build
      - name: Generate idempotent migration bundle
        run: mkdir -p artifacts && dotnet ef migrations script --idempotent --project src/Backend/ArtMarketplace.Infrastructure/ArtMarketplace.Infrastructure.csproj --startup-project src/Backend/ArtMarketplace.Api/ArtMarketplace.Api.csproj --configuration Release --no-build --output artifacts/migrations.sql
      - name: Test including PostgreSQL container smoke test
        run: dotnet test ArtMarketplace.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
      - name: Report vulnerable NuGet dependencies
        run: |
          dotnet list ArtMarketplace.sln package --vulnerable --include-transitive --format json > artifacts/nuget-vulnerabilities.json
          jq -e '([.. | objects | select(has("vulnerabilities")) | .vulnerabilities | length] | add // 0) == 0' artifacts/nuget-vulnerabilities.json
      - name: Validate Compose
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Build deployable container images
        run: docker compose -f deploy/docker-compose.yml build api identity backoffice public-web
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
      - name: Upload migration bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-migration-bundle
          path: artifacts/migrations.sql
          if-no-files-found: ignore
